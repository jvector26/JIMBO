name: access-test-2
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install curl_cffi requests
      - name: Probe blocked sources with different request methods
        shell: python
        run: |
          import os, re, subprocess
          import requests
          from curl_cffi import requests as creq

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          BASE = {"Accept": "application/json, text/plain, */*", "Accept-Language": "en-US,en;q=0.9",
                  "Origin": "https://www.nba.com", "Referer": "https://www.nba.com/"}
          STATS = dict(BASE, **{"x-nba-stats-origin": "stats", "x-nba-stats-token": "true"})
          notes = []

          def cell(ok, code, size):
              return f"✅ {size//1024} KB" if ok else f"❌ {code}"

          def m_requests(url, h):
              try:
                  r = requests.get(url, headers=dict(h, **{"User-Agent": UA, "Accept-Encoding": "gzip, deflate"}), timeout=20)
                  if r.status_code != 200: notes.append(f"{url[:45]}… server={r.headers.get('Server','?')}")
                  return cell(r.status_code == 200, r.status_code, len(r.content))
              except Exception as e: return f"❌ {type(e).__name__[:12]}"

          def m_curl(url, h):
              args = ["curl", "-s", "--compressed", "-m", "20", "-o", "/tmp/o", "-w", "%{http_code}", "-A", UA]
              for k, v in h.items(): args += ["-H", f"{k}: {v}"]
              code = subprocess.run(args + [url], capture_output=True, text=True).stdout.strip()
              size = os.path.getsize("/tmp/o") if os.path.exists("/tmp/o") else 0
              return cell(code == "200", code or "timeout", size)

          def m_chrome(url, h):
              try:
                  r = creq.get(url, headers=h, impersonate="chrome", timeout=20)
                  return cell(r.status_code == 200, r.status_code, len(r.content))
              except Exception as e: return f"❌ {type(e).__name__[:12]}"

          gid = "0022500001"
          tests = [
            ("NBA cdn scoreboard", "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json", BASE),
            ("NBA cdn schedule", "https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json", BASE),
            ("NBA cdn play-by-play", f"https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_{gid}.json", BASE),
            ("NBA S3 play-by-play", f"https://nba-prod-us-east-1-mediaops-stats.s3.amazonaws.com/NBA/liveData/playbyplay/playbyplay_{gid}.json", BASE),
            ("NBA S3 box score", f"https://nba-prod-us-east-1-mediaops-stats.s3.amazonaws.com/NBA/liveData/boxscore/boxscore_{gid}.json", BASE),
            ("stats.nba.com game log", "https://stats.nba.com/stats/leaguegamelog?Counter=10&Direction=DESC&LeagueID=00&PlayerOrTeam=T&Season=2025-26&SeasonType=Regular%20Season&Sorter=DATE", STATS),
            ("ESPN scoreboard", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard", {}),
            ("ESPN scoreboard (alt)", "https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard", {}),
            ("ESPN injuries", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries", {}),
          ]
          # official injury report: find a PDF link on the page, test fetching it
          try:
              page = requests.get("https://official.nba.com/nba-injury-report-2025-26-season/", headers={"User-Agent": UA}, timeout=20).text
              pdfs = re.findall(r'href="(https?://[^"]+\.pdf)"', page)
              notes.append(f"injury page PDF links found: {len(pdfs)}")
              if pdfs: tests.append(("NBA injury report PDF", pdfs[-1], {}))
          except Exception as e:
              notes.append(f"injury page error {e}")

          rows = ["| Source | plain | curl | Chrome-imitation |", "|---|---|---|---|"]
          for name, url, h in tests:
              rows.append(f"| {name} | {m_requests(url, h)} | {m_curl(url, h)} | {m_chrome(url, h)} |")
              print(rows[-1], flush=True)
          out = "## Access test 2\n\n" + "\n".join(rows) + "\n\n" + "\n".join("- " + n for n in notes[:12]) + "\n"
          print(out)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f: f.write(out)
