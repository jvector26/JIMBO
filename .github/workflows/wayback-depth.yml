name: wayback-depth
# One-off research job: archived preseason depth charts (RealGM/ESPN) for the minutes-model backtest.
on:
  workflow_dispatch:
    inputs:
      script:
        description: research script to run
        required: false
        default: wayback_depth.py
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python research/${{ github.event.inputs.script || 'wayback_depth.py' }}
      - name: Commit
        run: |
          git config user.name "jimbo-bot"; git config user.email "jimbo-bot@users.noreply.github.com"
          git add research/depth_wayback
          git commit -m "research: wayback depth charts" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
