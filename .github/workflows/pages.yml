name: pages
# Publish site/ (the JIMBO phone app) to GitHub Pages: after every nightly run, on pushes that change the app, or by hand.
on:
  workflow_run:
    workflows: ["nightly"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # the nightly commit, not the commit that started the nightly run
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # The artifact API sometimes doesn't list the just-uploaded artifact yet ("No artifacts named github-pages"),
      # which failed about half the runs in Nov 2026. Wait and retry instead of failing.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
