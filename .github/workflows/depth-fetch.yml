name: depth-fetch
# Fetch today's RealGM depth chart (manual for now; to be folded into nightly once the minutes change is approved).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi requests
      - run: python pipeline/depth_fetch.py --season 2026
      - name: Commit
        run: |
          git config user.name "jimbo-bot"; git config user.email "jimbo-bot@users.noreply.github.com"
          git add live/2026/depth
          git commit -m "depth chart $(date +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
