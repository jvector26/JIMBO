name: access-test
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe data sources
        shell: python
        run: |
          import os, time, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          STATS_H = {"User-Agent": UA, "Referer": "https://www.nba.com/", "Origin": "https://www.nba.com",
                     "Accept": "application/json", "x-nba-stats-origin": "stats", "x-nba-stats-token": "true"}
          tests = [
            ("NBA cdn scoreboard", "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json", {}),
            ("NBA cdn dated schedule", "https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json", {}),
            ("NBA cdn play-by-play", "https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_0022500001.json", {}),
            ("NBA cdn box score", "https://cdn.nba.com/static/json/liveData/boxscore/boxscore_0022500001.json", {}),
            ("stats.nba.com game log", "https://stats.nba.com/stats/leaguegamelog?Counter=10&Direction=DESC&LeagueID=00&PlayerOrTeam=T&Season=2025-26&SeasonType=Regular%20Season&Sorter=DATE", STATS_H),
            ("stats.nba.com hustle", "https://stats.nba.com/stats/leaguehustlestatsplayer?LeagueID=00&PerMode=Totals&Season=2025-26&SeasonType=Regular%20Season", STATS_H),
            ("NBA injury report page", "https://official.nba.com/nba-injury-report-2025-26-season/", {}),
            ("ESPN injuries", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries", {}),
            ("ESPN scoreboard (odds)", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard", {}),
            ("fixturedownload schedule", "https://fixturedownload.com/feed/json/nba-2026", {}),
            ("GitHub pbp mirror", "https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt", {}),
          ]
          rows = ["| Source | Result | Size | Time |", "|---|---|---|---|"]
          for name, url, h in tests:
              hdr = {"User-Agent": UA}; hdr.update(h)
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=25) as r:
                      body = r.read()
                      res = f"✅ {r.status}"
                      if b"seasonYear" in body[:3000]:
                          i = body.find(b"seasonYear"); res += " " + body[i:i+24].decode(errors="ignore")
                  size = f"{len(body)/1024:.0f} KB"
              except Exception as e:
                  res, size = f"❌ {type(e).__name__}: {str(e)[:60]}", "-"
              rows.append(f"| {name} | {res} | {size} | {time.time()-t:.1f}s |")
              print(rows[-1])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Data source access test\n\n" + "\n".join(rows) + "\n")
